
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #EBF2F5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .sidebar {
      width: 96px;
      height: 820px;
      background: #15C3D6;
      position: fixed;
      left: 0;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      border-bottom-right-radius: 24px;
      padding: 32px 0;
    }

    .logo {
      width: 48px;
    }

    .back-button {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: #12AFCB;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 22px;
      text-decoration: none;
    }

    .content {
      margin-left: 96px;
      padding: 64px;
    }

    .form-card {
      max-width: 700px;
      margin: auto;
      background: #fff;
      border: 1px solid #D3E2E5;
      border-radius: 20px;
      padding: 64px 80px;
    }

    h2 {
      font-size: 32px;
      color: #4D6F80;
      margin-bottom: 12px;
    }

    .divider {
      width: 100%;
      height: 1px;
      background: #D3E2E5;
      margin-bottom: 40px;
    }

    label {
      color: #8FA7B2;
      margin-bottom: 8px;
      display: block;
    }

    .form-control {
      background: #F5F8FA;
      border: 1px solid #D3E2E5;
      border-radius: 20px;
      height: 64px;
      padding: 20px;
      margin-bottom: 24px;
    }

    textarea.form-control {
      height: 120px;
      resize: none;
    }

    .text-limit {
      color: #8FA7B2;
      font-size: 14px;
      text-align: right;
      margin-top: -16px;
      margin-bottom: 24px;
    }

    .upload-box {
      width: 96px;
      height: 96px;
      border: 1px dashed #15C3D6;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #F5F8FA;
      cursor: pointer;
      margin-bottom: 40px;
    }

    .upload-box i {
      color: #15C3D6;
      font-size: 28px;
    }

    .map-box {
      width: 100%;
      height: 280px;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #D3E2E5;
      margin-bottom: 40px;
    }

    .map-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .switch-box {
      width: 64px;
      height: 24px;
    }

    .btn-confirmar {
      width: 100%;
      height: 64px;
      background: #37C77F;
      border: none;
      border-radius: 20px;
      color: white;
      font-weight: 700;
      margin-top: 24px;
    }

    .section-space {
      margin-top: 64px;
    }

    @media (max-width: 768px) {
      .content {
        margin-left: 0;
        padding: 20px;
      }

      .sidebar {
        display: none;
      }

      .form-card {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    <img src="img/Local.png" alt="Logo" class="logo">

    <a href="mapa.html" class="back-button">
      <i class="bi bi-arrow-left"></i>
    </a>
  </aside>

  <main class="content">
    <div class="form-card">

      <h2>Dados</h2>
      <div class="divider"></div>

      <div class="map-box">
        <img src="img/mapa (3).png" alt="Mapa">
      </div>

      <label>Nome</label>
      <input type="text" class="form-control">

      <label>Sobre</label>
      <textarea class="form-control"></textarea>
      <div class="text-limit">Máximo de 300 caracteres</div>

      <label>Número de Whatsapp</label>
      <input type="text" class="form-control">

      <label>Fotos</label>
      <div class="upload-box">
        <i class="bi bi-plus"></i>
      </div>

      <div class="section-space">
        <h2>Visitação</h2>
        <div class="divider"></div>

        <label>Instruções</label>
        <textarea class="form-control"></textarea>

        <label>Horário das visitas</label>
        <input type="text" class="form-control">

        <div class="d-flex justify-content-between align-items-center mt-4">
          <label class="mb-0">Atende fim de semana?</label>

          <div class="form-check form-switch switch-box">
            <input class="form-check-input" type="checkbox" role="switch">
          </div>
        </div>

        <button class="btn-confirmar">
          Confirmar
        </button>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
