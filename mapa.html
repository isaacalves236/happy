<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Mapa | Happy</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Fonte -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Nunito', sans-serif;
      overflow:hidden;
    }

    .map-page{
      width:100%;
      height:100vh;
      display:flex;
    }

    /* SIDEBAR */

    .sidebar{
      width:400px;
      height:100vh;

      background:linear-gradient(
        329.54deg,
        #29B6D1 0%,
        #00C7C7 100%
      );

      padding:80px;
      position:relative;

      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }

    .logo{
      width:70px;
      margin-bottom:70px;
    }

    .title{
      font-size:64px;
      font-weight:800;
      line-height:1.05;
      color:#FFF;
      margin-bottom:40px;
    }

    .description{
      font-size:24px;
      line-height:1.5;
      color:#FFF;
      max-width:280px;
    }

    .location{
      color:#FFF;
    }

    .location strong{
      display:block;
      font-size:32px;
      font-weight:800;
    }

    .location span{
      font-size:24px;
      font-weight:600;
    }

    /* MAPA */

    .map-container{
      flex:1;
      position:relative;
      overflow:hidden;
    }

    .map-image{
      width:100%;
      height:100vh;
      object-fit:cover;
    }

    /* PIN */

    .pin{
      position:absolute;
      width:72px;
      transition:0.3s;
      cursor:pointer;
    }

    .pin:hover{
      transform:scale(1.08);
    }

    .pin-top{
      top:235px;
      right:330px;
    }

    .pin-bottom{
      bottom:200px;
      left:300px;
    }

    /* BOTÃO + */

    .add-button{
      width:80px;
      height:80px;
      border:none;
      border-radius:28px;

      background:#15C3D6;

      position:absolute;
      right:40px;
      bottom:40px;

      display:flex;
      align-items:center;
      justify-content:center;

      color:#FFF;
      font-size:50px;
      font-weight:300;

      transition:0.3s;
    }

    .add-button:hover{
      transform:scale(1.05);
    }

    /* RESPONSIVO */

    @media(max-width:992px){

      body{
        overflow:auto;
      }

      .map-page{
        flex-direction:column;
      }

      .sidebar{
        width:100%;
        height:auto;
        padding:50px 35px;
      }

      .title{
        font-size:52px;
      }

      .description{
        font-size:22px;
        margin-bottom:60px;
      }

      .map-container{
        height:70vh;
      }

      .map-image{
        height:70vh;
      }

      .pin-top{
        top:140px;
        right:150px;
      }

      .pin-bottom{
        bottom:120px;
        left:120px;
      }
    }

    @media(max-width:576px){

      .sidebar{
        padding:40px 30px;
      }

      .title{
        font-size:46px;
      }

      .description{
        font-size:20px;
      }

      .location strong{
        font-size:28px;
      }

      .location span{
        font-size:20px;
      }

      .pin{
        width:60px;
      }

      .pin-top{
        top:100px;
        right:80px;
      }

      .pin-bottom{
        bottom:100px;
        left:70px;
      }

      .add-button{
        width:70px;
        height:70px;
        font-size:42px;
      }
    }

  </style>
</head>

<body>

  <div class="map-page">

    <!-- SIDEBAR -->
    <aside class="sidebar">

      <div>

        <img
          src="img/Local.png"
          class="logo"
          alt="Logo"
        >

        <h1 class="title">
          Escolha <br>
          um orfanato <br>
          no mapa
        </h1>

        <p class="description">
          Muitas crianças estão esperando a sua visita :)
        </p>

      </div>

      <div class="location">
        <strong>Rio do Sul</strong>
        <span>Santa Catarina</span>
      </div>

    </aside>

    <!-- MAPA -->
    <main class="map-container">

      <img
        src="img/Mapa (1).png"
        class="map-image"
        alt="Mapa"
      >

      <!-- PIN 1 -->
      <img
        src="img/Local.png"
        class="pin pin-top"
        alt="Pin"
      >

      <!-- PIN 2 -->
      <img
        src="img/Local.png"
        class="pin pin-bottom"
        alt="Pin"
      >

      <!-- BOTÃO -->
      <a href="dados.html" class="add-button">
        +
      </a>

    </main>

  </div>

</body>
</html>
