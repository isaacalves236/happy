<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy</title>

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Fonte -->
  <link
    href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap"
    rel="stylesheet"
  >

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Nunito', sans-serif;
      overflow-x:hidden;
    }

    .home{
      width:100%;
      min-height:100vh;
      background:#15C3D6;
      position:relative;
      display:flex;
      align-items:center;
    }

    .container-custom{
      width:100%;
      max-width:1200px;
      margin:auto;
      position:relative;
      z-index:2;

      display:flex;
      flex-direction:column;
      justify-content:space-between;

      min-height:85vh;
      padding:60px 20px;
    }

    .left-content{
      margin-top:30px;
    }

    .logo{
      width:180px;
      margin-bottom:40px;
    }

    .title{
      font-size:82px;
      font-weight:800;
      line-height:1.05;
      color:#fff;
      margin-bottom:45px;
    }

    .description{
      color:#fff;
      font-size:24px;
      max-width:420px;
      line-height:1.7;
      margin-bottom:80px;
    }

    .location{
      position:absolute;
      top:70px;
      right:0;
      text-align:right;
      color:#fff;
      font-size:28px;
      font-weight:700;
    }

    .location span{
      font-weight:400;
    }

    .kids{
      position:absolute;
      right:90px;
      top:52%;
      transform:translateY(-50%);
      width:560px;
    }

    .arrow-btn{
      width:90px;
      height:90px;
      border-radius:30px;
      background:#FFD666;
      border:none;
      position:absolute;
      right:0;
      bottom:70px;

      display:flex;
      align-items:center;
      justify-content:center;

      transition:0.3s;
      cursor:pointer;
    }

    .arrow-btn:hover{
      transform:scale(1.05);
    }

    .arrow-btn svg{
      width:32px;
      fill:#8D734B;
    }

    /* RESPONSIVO */

    @media(max-width:1200px){

      .title{
        font-size:70px;
      }

      .kids{
        width:460px;
      }
    }

    @media(max-width:992px){

      .home{
        padding:40px 20px;
      }

      .container-custom{
        display:flex;
        flex-direction:column;
        align-items:center;
        text-align:center;
      }

      .location{
        position:static;
        margin-bottom:40px;
        text-align:center;
      }

      .left-content{
        display:flex;
        flex-direction:column;
        align-items:center;
      }

      .logo{
        margin-bottom:40px;
      }

      .title{
        font-size:60px;
      }

      .description{
        margin-bottom:50px;
      }

      .kids{
        position:static;
        transform:none;
        width:380px;
        margin-top:20px;
      }

      .arrow-btn{
        position:static;
        margin-top:40px;
      }
    }

    @media(max-width:576px){

      .title{
        font-size:46px;
      }

      .description{
        font-size:20px;
      }

      .kids{
        width:100%;
      }

      .logo{
        width:150px;
      }

      .location{
        font-size:22px;
      }

      .arrow-btn{
        width:75px;
        height:75px;
      }
    }

  </style>

</head>

<body>

  <section class="home">

    <div class="container-custom">

      <!-- Localização -->
      <div class="location">
        Rio do Sul <br>
        <span>Santa Catarina</span>
      </div>

      <!-- Conteúdo esquerdo -->
      <div class="left-content">

        <img src="img/Logo.png" class="logo" alt="Logo">

        <h1 class="title">
          Leve <br>
          felicidade <br>
          para o <br>
          mundo
        </h1>

        <p class="description">
          Visite orfanatos e mude o dia de muitas crianças.
        </p>

      </div>

      <!-- Ilustração -->
      <img src="img/Ilustra02.png" class="kids" alt="Crianças">

      <!-- Botão -->
      <a class="arrow-btn" href="mapa.html">

        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M13.172 12 8.222 7.05l1.414-1.414L16 12l-6.364 6.364-1.414-1.414z"/>
        </svg>

      </a>

    </div>

  </section>

</body>
</html>
